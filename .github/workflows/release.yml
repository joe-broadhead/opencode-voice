name: release

# Publishes a release on a tag cut by `npx plugin-kit release <version>` on master. The owner pushes the tag; this
# workflow builds the release files, runs the whole check again, pins the native engine assets, and creates the GitHub
# release with the tarball, dist/, SHA256SUMS and the conformance report. It never tags and never moves a tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub release on the pushed tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The pinned Aurum binaries, gzipped and checked against manifest/aurum.json, plus the candidate
      # manifest/native.json that makes this copy of the plugin installable. The asset URLs name this tag.
      - name: Build and pin the native engine assets
        run: |
          node scripts/build-native.mjs --release "$RUNNER_TEMP/native" \
            --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          cp "$RUNNER_TEMP/native/native-manifest.json" manifest/native.json
      - name: Pack the tarball with the native pin, and stage the release files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP"/native/*.gz "$RUNNER_TEMP/native/LICENSE.aurum" "$RUNNER_TEMP/native/native-manifest.json" "$RUNNER_TEMP/release/"
          cp dist/index.js dist/tui.js "$RUNNER_TEMP/release/"
      - name: Conformance report
        run: npx plugin-kit conformance --json > "$RUNNER_TEMP/release/conformance-report.json"
      - name: SHA256SUMS
        run: |
          cd "$RUNNER_TEMP/release"
          find . -type f ! -name SHA256SUMS | sed 's#^\./##' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            "$RUNNER_TEMP"/release/*
