name: Release

# A tag v<package.json version> on a master commit whose CI passed creates the GitHub Release. Releases are not
# published to npm: a consumer pins the tag, github:we-the-rebel-alliance/voice-plugin#v<version>, and the committed
# dist/ is what that tag installs, with no build. The release carries the package tarball, conformance.json and
# SHA256SUMS only: the pinned Aurum engine is downloaded from its upstream address in manifest/aurum.json, never
# re-hosted here. Only the owner decides a release; an agent never pushes a tag on its own.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: boxd-public
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub release on the pushed tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          # Never restore a cache made in another runner's home: a hit can point at a bun binary that is not there.
          no-cache: true
      - name: Fetch the contract over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      # The built entry is committed: the tag must carry the dist its source produces.
      - name: Check that the committed dist is current
        run: npm run bundle && git diff --exit-code -- dist/
      - run: npm run check
      - name: The tag names this package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$TAG"
      # The package tarball, the conformance report and their checksums. No native binaries or native manifest: the
      # installed plugin downloads the pinned engine from its upstream address in manifest/aurum.json.
      - name: Pack the release files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          npx plugin-kit check --json > "$RUNNER_TEMP/release/conformance.json"
          cd "$RUNNER_TEMP/release"
          sha256sum ./*.tgz ./conformance.json > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$RUNNER_TEMP"/release/*.tgz \
            "$RUNNER_TEMP"/release/conformance.json \
            "$RUNNER_TEMP"/release/SHA256SUMS \
            --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
