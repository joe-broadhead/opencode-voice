name: release

# Publishes a release on a tag cut by `npx plugin-kit release <version>` on master. The owner pushes the tag; this
# workflow checks the committed bundle, runs the whole check again, pins the native engine assets, and creates the
# GitHub release with the tarball, dist/, SHA256SUMS and the conformance report. It never tags and never moves a tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub release on the pushed tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: npm ci --ignore-scripts
      # The built entry is committed: the tag must carry the dist its source produces.
      - name: Check that the committed dist is current
        run: npm run bundle && git diff --exit-code dist/
      - run: npm run check
      # The pinned Aurum binaries, gzipped from manifest/aurum.json, must match the committed manifest/native.json
      # (URLs, sizes, hashes and the licence), so the tag's tree and this run's release assets cannot disagree.
      - name: Build the native engine assets and verify them against the committed manifest
        run: |
          node scripts/build-native.mjs --release "$RUNNER_TEMP/native" \
            --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --verify manifest/native.json
      - name: Pack the tarball with the committed native pin, and stage the release files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP"/native/*.gz "$RUNNER_TEMP/native/LICENSE.aurum" "$RUNNER_TEMP/release/"
          cp manifest/native.json "$RUNNER_TEMP/release/native.json"
          cp dist/index.js dist/tui.js "$RUNNER_TEMP/release/"
      - name: Conformance report
        run: npx plugin-kit conformance --json > "$RUNNER_TEMP/release/conformance-report.json"
      - name: SHA256SUMS
        run: |
          cd "$RUNNER_TEMP/release"
          find . -type f ! -name SHA256SUMS | sed 's#^\./##' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            "$RUNNER_TEMP"/release/*
