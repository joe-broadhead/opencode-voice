name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/ci.yml .github/workflows/release.yml
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Public GitHub-hosted runners: Linux x64 and arm64, macOS arm64 and x64.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Caches ~/.npm per OS and architecture. The host and pack stages install @opencode/sdk and the stock
          # @opencode/cli for each release in TESTED_HOSTS (src/constants.ts: 2.2.3, 2.2.4, 2.2.5 and 2.2.6) through npm,
          # so that file is part of the key.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/constants.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # the Bun inside stock OpenCode 2.2.3, 2.2.4, 2.2.5 and 2.2.6
      - run: npm ci --ignore-scripts
      - name: Build this runner's platform package, for the packed-install test
        run: node scripts/build-bins.mjs --current
      # The stock binaries the host suite spawns, so every tested release really runs in CI (R11): the gate in
      # test/support/stock-gate.ts fails a missing one. Each is the release's own platform package, as charts does it.
      - name: Stock OpenCode binaries
        run: |
          platform="$(node -p 'process.platform')-$(node -p 'process.arch')"
          for version in 2.2.3 2.2.4 2.2.5 2.2.6; do
            dir="$RUNNER_TEMP/stock-$version"
            mkdir -p "$dir"
            (cd "$dir" && npm init -y >/dev/null && npm install "@opencode/cli@$version" "@opencode/cli-$platform@$version" --omit=optional --ignore-scripts --no-audit --no-fund)
            echo "OPENCODE_BIN_${version//./_}=$dir/node_modules/@opencode/cli-$platform/bin/opencode" >> "$GITHUB_ENV"
          done
      - run: npm run check
